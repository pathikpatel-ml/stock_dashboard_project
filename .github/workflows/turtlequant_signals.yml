name: Generate Turtle Quant Signals

on:
  schedule:
    # 02:30 UTC Sunday -- 30 min after turtle_fundamentals.yml's weekly screener.in scrape
    # (00:00 UTC Sunday... see that workflow's own comment), so this run picks up that run's
    # freshly-updated quality/valuation flags. 2026-10-02: the original weekly-candle technical
    # signal system that motivated this exact timing was removed; kept the same slot since it
    # still serves the (now sole) purpose of propagating turtle_fundamentals -> this table.
    - cron: '30 2 * * 0'
  workflow_dispatch:

jobs:
  generate-turtlequant-signals:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with: { python-version: '3.13' }
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy requests psycopg2-binary python-dotenv
    - name: Generate Turtle Quant signals
      env:
        MARKET_DATA_DB_URL: ${{ secrets.MARKET_DATA_DB_URL }}
      run: python generate_turtlequant_signals.py
