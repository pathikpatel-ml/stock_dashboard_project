name: Generate Turtle Quant Signals

on:
  schedule:
    # 02:30 UTC Sunday (~8:00 AM IST) -- runs ONCE per week, over the weekend, using the
    # just-closed, fully-final previous week (through Friday's close). Deliberately NOT a
    # weekday schedule: this is a weekly-candle strategy, so evaluating a still-forming
    # mid-week candle every weekday made the exact moment to act on a signal unclear (you'd
    # see Monday's signal only after Monday's session had already happened, based on a week
    # that wasn't even done yet). Running once on the weekend means the signal is fully
    # settled and ready before Monday's market open -- confirmed with the user 2026-09-05.
    - cron: '30 2 * * 0'
  workflow_dispatch:

jobs:
  generate-turtlequant-signals:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with: { python-version: '3.13' }
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy yfinance requests psycopg2-binary python-dotenv
    - name: Generate Turtle Quant signals
      env:
        MARKET_DATA_DB_URL: ${{ secrets.MARKET_DATA_DB_URL }}
      run: python generate_turtlequant_signals.py
