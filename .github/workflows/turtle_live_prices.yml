name: Refresh Turtle Live Prices (Intraday)

on:
  schedule:
    # ~4:07 PM IST = 10:37 UTC, every day of the week (explicit fixed schedule set 2026-10-13
    # per the user's own request, replacing the earlier 3x/day-weekdays-only cadence).
    # 2026-10-14: moved off the exact :30 round minute -- confirmed live this job FULLY SKIPPED
    # its entire Oct 14 run (not just delayed) at the round-minute slot; see
    # daily_gtt_trigger.yml's schedule comment for the general mechanism.
    - cron: '37 10 * * *'
  workflow_dispatch:

jobs:
  refresh-turtle-live-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with: { python-version: '3.13' }
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy yfinance requests psycopg2-binary python-dotenv
    - name: Refresh live prices
      env:
        MARKET_DATA_DB_URL: ${{ secrets.MARKET_DATA_DB_URL }}
      run: python generate_turtle_live_prices.py
