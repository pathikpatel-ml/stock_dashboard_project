name: Refresh Turtle Live Prices (Intraday)

on:
  schedule:
    # 4:00 PM IST = 10:30 UTC, every day of the week (explicit fixed schedule set 2026-10-13
    # per the user's own request, replacing the earlier 3x/day-weekdays-only cadence).
    # NOTE: an exact round minute (:30) can see the occasional GitHub Actions scheduling delay
    # under high load (see daily_gtt_trigger.yml's schedule comment for the general mechanism)
    # -- kept here anyway since the user asked for this precise clock time explicitly.
    - cron: '30 10 * * *'
  workflow_dispatch:

jobs:
  refresh-turtle-live-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with: { python-version: '3.13' }
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy yfinance requests psycopg2-binary python-dotenv
    - name: Refresh live prices
      env:
        MARKET_DATA_DB_URL: ${{ secrets.MARKET_DATA_DB_URL }}
      run: python generate_turtle_live_prices.py
