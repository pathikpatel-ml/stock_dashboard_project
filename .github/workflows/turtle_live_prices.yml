name: Refresh Turtle Live Prices (Intraday)

on:
  schedule:
    # 10:30, 12:30, 15:30 IST weekdays -- a few touches across market hours (9:15-15:30 IST).
    # Separate from turtle_signals.yml's once-daily full ADD/HOLD/EXIT recompute after close.
    - cron: '0 5,7,10 * * 1-5'
  workflow_dispatch:

jobs:
  refresh-turtle-live-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with: { python-version: '3.13' }
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy yfinance requests psycopg2-binary python-dotenv
    - name: Refresh live prices
      env:
        MARKET_DATA_DB_URL: ${{ secrets.MARKET_DATA_DB_URL }}
      run: python generate_turtle_live_prices.py
