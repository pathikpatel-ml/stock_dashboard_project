name: Weekly Stock Screening

on:
  schedule:
    # Run every Sunday at 6:00 AM IST (00:30 UTC)
    - cron: '30 0 * * 0'
  workflow_dispatch: # Allow manual trigger

jobs:
  generate-stock-list:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Generate weekly stock list
      env:
        MARKET_DATA_DB_URL: ${{ secrets.MARKET_DATA_DB_URL }}
      run: |
        python generate_weekly_stock_list.py
