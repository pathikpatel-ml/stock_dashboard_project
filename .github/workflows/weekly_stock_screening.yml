name: Weekly Stock Screening

on:
  schedule:
    # 2026-11-08 (per explicit user request): moved from Sunday to Monday. Run every Monday
    # at ~6:07 AM IST (00:37 UTC) -- NOT the literal 6:00 AM asked for, deliberately kept off
    # the round :00/:30 minute: confirmed live elsewhere in this project that GitHub Actions
    # can fully SKIP an entire day's run (not just delay it) at an exact round-minute slot --
    # see daily_gtt_trigger.yml's schedule comment for the original incident. cron
    # day-of-week 1 = Monday.
    - cron: '37 0 * * 1'
  workflow_dispatch: # Allow manual trigger

jobs:
  generate-stock-list:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Generate weekly stock list
      env:
        MARKET_DATA_DB_URL: ${{ secrets.MARKET_DATA_DB_URL }}
      run: |
        python generate_weekly_stock_list.py
