name: Generate Turtle Strategy Fundamentals (screener.in)

on:
  schedule:
    # Sunday 1:00 AM IST = Saturday 19:30 UTC (explicit fixed schedule set 2026-10-13 per the
    # user's own request). NOTE: an exact round minute (:30) can see the occasional GitHub
    # Actions scheduling delay under high load (see daily_gtt_trigger.yml's schedule comment
    # for the general mechanism) -- kept here anyway since the user asked for this precise
    # clock time explicitly.
    - cron: '30 19 * * 6'
  workflow_dispatch:

jobs:
  generate-turtle-fundamentals:
    runs-on: ubuntu-latest
    # 2026-10-12: raised from 240 to 360 (GitHub-hosted runners' own hard ceiling for a single
    # job -- can't go higher without a self-hosted runner). Confirmed live: the hard-timeout
    # fix in modules/turtle/http_utils.py (2026-10-11) stops individual requests from hanging
    # forever, but screener.in/NSE still occasionally rate-limits/slows down for a stretch of
    # ~100 consecutive symbols (45-80 min instead of the normal ~2.5 min) -- not a hang, just
    # genuinely slow, so a longer ceiling is the honest fix rather than another retry.
    timeout-minutes: 360
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with: { python-version: '3.13' }
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy requests beautifulsoup4 psycopg2-binary python-dotenv yfinance
    - name: Generate Turtle standalone fundamentals (screener.in)
      env:
        MARKET_DATA_DB_URL: ${{ secrets.MARKET_DATA_DB_URL }}
        # 2026-10-02: unbuffered stdout -- a killed run previously showed ZERO log output for
        # its entire 3-hour lifetime because Python block-buffers stdout when it isn't a
        # terminal (exactly GitHub Actions' case), so a forced kill loses everything still
        # sitting in the buffer. This was actively hiding whether the job was truly hung or
        # just slow. -u makes every print() visible immediately, giving real diagnostic signal.
      run: python -u generate_turtle_fundamentals.py --pause 0.5
