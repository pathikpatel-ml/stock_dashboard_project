name: Generate Turtle Strategy Fundamentals (screener.in)

on:
  schedule:
    # 2026-10-13 (revised same day per user request): all 7 of the universe's 1/7 slices now
    # run on SUNDAY ONLY, 3 hours apart, instead of spread one-per-day across the week -- the
    # user judged each ~375-symbol slice unlikely to ever take more than ~2 hours (confirmed
    # live: a real run took ~9 minutes with no stalls), so 7 runs comfortably fit in one day
    # with room to spare between them. Each cron entry below is matched to its own
    # --day-of-week value in the run step via ${{ github.event.schedule }} (the exact cron
    # string that fired this particular run) -- see that step's case statement.
    # 2026-10-14: moved every slot off the exact :30 round minute to :37 -- confirmed live
    # that the two OTHER daily jobs on an exact :30 minute fully skipped entire days (not just
    # delayed) at that slot; see daily_gtt_trigger.yml's schedule comment for the general
    # mechanism. IST slot -> UTC cron (now ~7 min later than the originally-asked clock time):
    #   ~1:07 AM IST Sun -> 19:37 UTC Sat   (slice 0)
    #   ~4:07 AM IST Sun -> 22:37 UTC Sat   (slice 1)
    #   ~7:07 AM IST Sun -> 01:37 UTC Sun   (slice 2)
    #  ~10:07 AM IST Sun -> 04:37 UTC Sun   (slice 3)
    #   ~1:07 PM IST Sun -> 07:37 UTC Sun   (slice 4)
    #   ~4:07 PM IST Sun -> 10:37 UTC Sun   (slice 5)
    #   ~7:07 PM IST Sun -> 13:37 UTC Sun   (slice 6)
    - cron: '37 19 * * 6'
    - cron: '37 22 * * 6'
    - cron: '37 1 * * 0'
    - cron: '37 4 * * 0'
    - cron: '37 7 * * 0'
    - cron: '37 10 * * 0'
    - cron: '37 13 * * 0'
  workflow_dispatch:
    inputs:
      day_of_week:
        description: "0=Monday..6=Sunday -- which 1/7 slice to fetch (blank = auto-detect today's IST weekday)"
        type: string
        default: ""
      full_universe:
        description: "Fetch every symbol in one run instead of just one 1/7 slice"
        type: boolean
        default: false

jobs:
  generate-turtle-fundamentals:
    runs-on: ubuntu-latest
    # 2026-10-13: each run is only ~1/7 of the universe (~375 symbols, measured ~9min with no
    # stalls) instead of the full ~2,600 -- 90min comfortably covers even a bad stretch of
    # slow/throttled symbols, with 3 hours between consecutive runs so there's no risk of one
    # slice's run overlapping into the next one's start time.
    timeout-minutes: 90
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with: { python-version: '3.13' }
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy requests beautifulsoup4 psycopg2-binary python-dotenv yfinance
    - name: Generate Turtle standalone fundamentals (screener.in)
      env:
        MARKET_DATA_DB_URL: ${{ secrets.MARKET_DATA_DB_URL }}
        # 2026-10-02: unbuffered stdout -- a killed run previously showed ZERO log output for
        # its entire 3-hour lifetime because Python block-buffers stdout when it isn't a
        # terminal (exactly GitHub Actions' case), so a forced kill loses everything still
        # sitting in the buffer. This was actively hiding whether the job was truly hung or
        # just slow. -u makes every print() visible immediately, giving real diagnostic signal.
      run: |
        ARGS="--pause 0.5"
        if [ "${{ github.event.inputs.full_universe }}" = "true" ]; then
          ARGS="$ARGS --full-universe"
        else
          # Map this run's exact triggering cron entry to its own slice index (0-6) -- all 7
          # schedules fire on the same real Sunday, so the script's own auto-detected IST
          # weekday (always "Sunday") can't tell them apart; must pass --day-of-week explicitly.
          # workflow_dispatch's own day_of_week input (if given) takes precedence; otherwise
          # falls through to the schedule-entry mapping, and finally to the script's own
          # auto-detect if neither matches (manual run with no input given).
          case "${{ github.event.inputs.day_of_week }}" in
            0|1|2|3|4|5|6) DOW="${{ github.event.inputs.day_of_week }}" ;;
            *)
              case "${{ github.event.schedule }}" in
                "37 19 * * 6") DOW=0 ;;
                "37 22 * * 6") DOW=1 ;;
                "37 1 * * 0")  DOW=2 ;;
                "37 4 * * 0")  DOW=3 ;;
                "37 7 * * 0")  DOW=4 ;;
                "37 10 * * 0") DOW=5 ;;
                "37 13 * * 0") DOW=6 ;;
                *) DOW="" ;;
              esac
              ;;
          esac
          if [ -n "$DOW" ]; then
            ARGS="$ARGS --day-of-week $DOW"
          fi
        fi
        python -u generate_turtle_fundamentals.py $ARGS
