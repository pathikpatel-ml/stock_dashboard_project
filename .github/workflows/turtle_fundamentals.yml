name: Generate Turtle Strategy Fundamentals (screener.in)

on:
  schedule:
    - cron: '0 2 * * 0'   # 02:00 UTC Sunday — after weekly_stock_screening (00:30 UTC Sun), weekly since TTM/annual figures don't change daily
  workflow_dispatch:

jobs:
  generate-turtle-fundamentals:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with: { python-version: '3.13' }
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy requests beautifulsoup4 psycopg2-binary python-dotenv
    - name: Generate Turtle standalone fundamentals (screener.in)
      env:
        MARKET_DATA_DB_URL: ${{ secrets.MARKET_DATA_DB_URL }}
      run: python generate_turtle_fundamentals.py --pause 0.5
