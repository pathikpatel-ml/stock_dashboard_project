name: Generate Turtle Strategy Fundamentals (screener.in)

on:
  schedule:
    # 02:07 UTC Sunday -- after weekly_stock_screening (00:37 UTC Sun), weekly since TTM/annual
    # figures don't change daily. 2026-10-07: moved off the round :00 minute -- see
    # daily_gtt_trigger.yml's schedule comment for why.
    - cron: '7 2 * * 0'
  workflow_dispatch:

jobs:
  generate-turtle-fundamentals:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with: { python-version: '3.13' }
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy requests beautifulsoup4 psycopg2-binary python-dotenv yfinance
    - name: Generate Turtle standalone fundamentals (screener.in)
      env:
        MARKET_DATA_DB_URL: ${{ secrets.MARKET_DATA_DB_URL }}
        # 2026-10-02: unbuffered stdout -- a killed run previously showed ZERO log output for
        # its entire 3-hour lifetime because Python block-buffers stdout when it isn't a
        # terminal (exactly GitHub Actions' case), so a forced kill loses everything still
        # sitting in the buffer. This was actively hiding whether the job was truly hung or
        # just slow. -u makes every print() visible immediately, giving real diagnostic signal.
      run: python -u generate_turtle_fundamentals.py --pause 0.5
