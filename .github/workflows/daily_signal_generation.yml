name: Generate Daily V20 Signals from Dynamic Stock List

on:
  schedule:
    # Runs ~2:13 AM UTC daily -- moved off the round :00 minute (2026-10-07) since GitHub
    # Actions deprioritizes/drops scheduled runs at round minutes during high load; see
    # daily_gtt_trigger.yml's schedule comment for the full reasoning.
    - cron: '13 2 * * *'
  workflow_dispatch: # Allows manual triggering

jobs:
  build-and-commit-signals:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas yfinance psycopg2-binary python-dotenv

    - name: Configure Git User
      run: |
        git config --global user.name "${{ github.actor }}"
        git config --global user.email "${{ github.actor }}@users.noreply.github.com"

    - name: Generate V20 signals from dynamic stock list
      env:
        MARKET_DATA_DB_URL: ${{ secrets.MARKET_DATA_DB_URL }}
      run: python generate_daily_signals.py
