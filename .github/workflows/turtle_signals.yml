name: Generate Turtle Strategy Signals

on:
  schedule:
    # 10:52 UTC weekdays (~16:22 IST, after NSE close). 2026-10-07: moved off the round :45
    # minute -- confirmed live this exact job's scheduled trigger was regularly delayed by
    # 5-8+ hours (and once didn't fire at all for a full day); see daily_gtt_trigger.yml's
    # schedule comment for why.
    - cron: '52 10 * * 1-5'
  workflow_dispatch:

jobs:
  generate-turtle-signals:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with: { python-version: '3.13' }
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy yfinance requests psycopg2-binary python-dotenv
    - name: Generate Turtle signals
      env:
        MARKET_DATA_DB_URL: ${{ secrets.MARKET_DATA_DB_URL }}
      run: python generate_turtle_signals.py
