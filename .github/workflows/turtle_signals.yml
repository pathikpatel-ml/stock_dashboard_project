name: Generate Turtle Strategy Signals

on:
  schedule:
    # 6:00 PM IST = 12:30 UTC, every day of the week (explicit fixed schedule set 2026-10-13
    # per the user's own request, replacing the earlier weekdays-only 10:52 UTC slot).
    # NOTE: an exact round minute (:30) can see the occasional GitHub Actions scheduling delay
    # under high load (see daily_gtt_trigger.yml's schedule comment for the general mechanism)
    # -- kept here anyway since the user asked for this precise clock time explicitly.
    - cron: '30 12 * * *'
  workflow_dispatch:

jobs:
  generate-turtle-signals:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with: { python-version: '3.13' }
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy yfinance requests psycopg2-binary python-dotenv
    - name: Generate Turtle signals
      env:
        MARKET_DATA_DB_URL: ${{ secrets.MARKET_DATA_DB_URL }}
      run: python generate_turtle_signals.py
