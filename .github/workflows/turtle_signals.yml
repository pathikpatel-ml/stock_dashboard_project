name: Generate Turtle Strategy Signals

on:
  schedule:
    - cron: '45 10 * * 1-5'   # 10:45 UTC weekdays (~16:15 IST, after NSE close)
  workflow_dispatch:

jobs:
  generate-turtle-signals:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with: { python-version: '3.13' }
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy yfinance requests psycopg2-binary python-dotenv
    - name: Generate Turtle signals
      env:
        MARKET_DATA_DB_URL: ${{ secrets.MARKET_DATA_DB_URL }}
      run: python generate_turtle_signals.py
